name: Changelog no Discord

# Dispara na mesma tag "vX.Y.Z" que o release.yml usa pra gerar o instalador -
# ou seja, so posta changelog quando um release de verdade e publicado, nao a
# cada merge na main. Aqui so lemos o historico de commits e mandamos um
# resumo pro canal de atualizacoes do Discord via webhook; nada e escrito de
# volta no repo.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gera o changelog e posta no Discord
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          # Configurar manualmente em Settings > Secrets and variables > Actions
          # do repositorio, com esse nome exato: DISCORD_UPDATES_WEBHOOK_URL
          # (webhook do canal "atualizacoes" no Discord).
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_UPDATES_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || true)

          if [ -n "$PREV_TAG" ]; then
            echo "Tag anterior: $PREV_TAG. Range: ${PREV_TAG}..${TAG_NAME}"
            RANGE="${PREV_TAG}..${TAG_NAME}"
          else
            echo "Nenhuma tag anterior encontrada (primeiro release). Usando fallback dos ultimos 20 commits."
            RANGE=""
          fi

          # Este changelog e so sobre o app desktop (o que o auto-update
          # instala) - commits que so mexem em backend/bot do Discord/scripts
          # internos nao dizem nada pro usuario final e nao devem aparecer
          # aqui. So entra commit que toca pelo menos um arquivo dentro dessas
          # pastas (o codigo que de fato vai pro .exe).
          APP_PATH_REGEX='^(core/|gui/|functions/|main\.py$)'

          only_app_commits() {
            while IFS= read -r sha; do
              [ -z "$sha" ] && continue
              if git diff-tree --no-commit-id --name-only -r "$sha" | grep -qE "$APP_PATH_REGEX"; then
                git log -1 --pretty=format:'%s' "$sha"
                echo
              fi
            done
          }

          # Prefixo de commit convencional (feat:, fix:, etc.) e commits de bump
          # de versao ("release: ...") nao dizem nada pro usuario final - o sed
          # tira o prefixo e o grep -v filtra os releases antes de formatar.
          format_subjects() {
            sed -E 's/^(feat|fix|refactor|release|chore|docs|test|perf|style|build|ci)(\([^)]*\))?:\s*//' \
              | grep -viE '^(bump|release)\b' \
              | awk 'NF { $0 = toupper(substr($0,1,1)) substr($0,2); print "✅ " $0 }'
          }

          if [ -n "$RANGE" ]; then
            SHAS=$(git log "$RANGE" --no-merges --pretty=format:'%H')
          else
            SHAS=$(git log -n 20 "$TAG_NAME" --no-merges --pretty=format:'%H')
          fi

          COMMITS=$(printf '%s\n' "$SHAS" | only_app_commits | format_subjects || true)

          if [ -z "$COMMITS" ]; then
            echo "Nenhum commit relevante encontrado, pulando post."
            exit 0
          fi

          TOTAL_COMMITS=$(printf '%s\n' "$COMMITS" | grep -c '^✅')
          echo "Total de itens no changelog: $TOTAL_COMMITS"

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "::warning::DISCORD_UPDATES_WEBHOOK_URL nao esta configurado (Settings > Secrets and variables > Actions do repositorio). Pulando post no Discord sem falhar o job."
            exit 0
          fi

          HEADER="As alteracoes abaixo foram publicadas em producao."
          DESCRIPTION_LIMIT=4096
          BODY="$COMMITS"

          if [ "${#COMMITS}" -gt "$((DESCRIPTION_LIMIT - ${#HEADER} - 100))" ]; then
            MAX_LEN=$((DESCRIPTION_LIMIT - ${#HEADER} - 100))
            TRUNCATED="${COMMITS:0:$MAX_LEN}"
            TRUNCATED="${TRUNCATED%$'\n'*}"
            SHOWN_COMMITS=$(printf '%s\n' "$TRUNCATED" | grep -c '^✅')
            REMAINING=$((TOTAL_COMMITS - SHOWN_COMMITS))
            BODY="${TRUNCATED}"$'\n'"...e mais ${REMAINING} itens"
            echo "Changelog truncado: mostrando $SHOWN_COMMITS de $TOTAL_COMMITS itens (limite de descricao do embed do Discord)."
          fi

          DESCRIPTION="${HEADER}"$'\n\n'"${BODY}"
          TITLE="Atualizações - EasyF ${TAG_NAME}"

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg desc "$DESCRIPTION" \
            '{embeds: [{title: $title, description: $desc, color: 5793266}]}')

          HTTP_STATUS=$(curl -sS -o /tmp/discord_response.txt -w '%{http_code}' \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL")

          if [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Falha ao postar no Discord (HTTP $HTTP_STATUS):"
            cat /tmp/discord_response.txt
            exit 1
          fi

          echo "Changelog postado no Discord com sucesso ($TOTAL_COMMITS itens)."
