name: Build e Release

# Dispara quando uma tag "vX.Y.Z" e enviada (ex: git tag v1.1.0 && git push origin v1.1.0).
# Empurrar codigo pra main/dev NAO cria release nenhuma - so uma tag dispara isso.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # necessario pro GITHUB_TOKEN poder criar a release e subir o asset

jobs:
  build:
    # PyInstaller nao faz cross-compile - o .exe do Windows precisa ser
    # gerado numa maquina Windows (mesma exigencia do build.bat local).
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixa o instalador do Tesseract (embutido no pacote)
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/tesseract-ocr/tesseract/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "tesseract-ocr-w64-setup*.exe" } | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "assets" | Out-Null
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "assets\tesseract-ocr-w64-setup.exe"

      - name: Instala dependencias
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          REM pyinstaller >=6.22.1 adiciona uma validacao de seguranca no
          REM bootloader onefile que checa o processo pai do .exe relancado -
          REM nosso auto-update (core/updater.py) relanca via "cmd /c start"
          REM depois de mover o arquivo, e nesse encadeamento o bootloader as
          REM vezes nao consegue resolver o processo pai a tempo, falhando com
          REM "Security validation failure: failed to obtain executable path
          REM for parent process!". Fixado ate redesenhar o relancamento.
          python -m pip install "pyinstaller<6.22.1"

      - name: Gera o executavel
        shell: cmd
        run: python -m PyInstaller EasyF.spec --noconfirm --clean

      - name: Acha o .exe gerado
        id: find_exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "dist" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Nenhum .exe encontrado em dist/ apos o build." }
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Instala o NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # choco atualiza o PATH do sistema, mas o job atual nao ve isso
          # sozinho - precisa adicionar explicitamente pro GITHUB_PATH pra
          # os proximos passos (mesmo job) encontrarem o makensis.
          "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Gera o instalador (atalho na Area de Trabalho, Menu Iniciar, desinstalador)
        shell: pwsh
        run: |
          makensis /DEXE_PATH="${{ steps.find_exe.outputs.path }}" /DEXE_NAME="${{ steps.find_exe.outputs.name }}" installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis falhou (codigo $LASTEXITCODE)." }

      - name: Publica a Release com o .exe portatil e o instalador anexados
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.find_exe.outputs.path }}
            dist/EasyF-Setup.exe
          generate_release_notes: true
